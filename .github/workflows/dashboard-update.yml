name: Update Notion Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/notionDashboardUpdate.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
